<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Étiquettes PDF à partir de Fichiers</title>

  <script src="./xlsx.full.min.js.js"></script>
  <script src="./jspdf.umd.min.js.js"></script>
  <script src="./papaparse.min.js.js"></script>
  
  <script async src="./script-compare.js"></script>
  
  <link href="style-pdf.css" rel="stylesheet" type="text/css" />
  
</head>
<body>
  <div class="div-main">
  <h1>Comparaitre deux fichiers</h1>
  <p>À partir de Fichiers au formats ( *.csv, *xlxs, *.xls, *.tsv ) , comprenant les colonnes suivantes :</p>
  <br>
  <table>
      <tr>
          <th>Identifiant</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Adresse</th>
          <th>Code postale</th>
          <th>Ville</th>
      </tr>
      <tr>
          <td>(0)</td>
          <td>(1)</td>
          <td>(2)</td>
          <td>(3)</td>
          <td>(4)</td>
          <td>(5)</td>
      </tr>
  </table>
  <div class="div-import">
      <p>Veuillez sélectionner les fichiers à importer ...</p>
      <br>
      <label>Fichier 1
      <input type="file" id="fileInputA" accept=".csv,.xlsx,.xls,.tsv">
      </label>
      <label>Fichier 2
      <input type="file" id="fileInputB" accept=".csv,.xlsx,.xls,.tsv">
      </label>
      <button id="compareButton">Comparer</button>
      <h2>Résultats :</h2>
      <div id="result"></div>
  </div>
</div>
</body>
</html>
