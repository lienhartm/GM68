<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSV vers Étiquettes PDF</title>
  <script src="./jspdf.umd.min.js.js"></script>
</head>
<body>
  <h1>Créer des Étiquettes PDF</h1>
  <input type="file" id="fileInput" accept=".tsv">
  <button id="generatePdf">Générer Étiquettes PDF</button>

  <script>
    document.getElementById('generatePdf').addEventListener('click', () => {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) {
        alert('Veuillez sélectionner un fichier TSV.');
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = (event) => {
        const content = event.target.result;

        // Convertir TSV en tableau
        const rows = content.trim().split('\n');
        const data = rows.map(row => row.split('\t'));

        // Indices des colonnes nécessaires
        const columnMapping = {
          identifiant: 0,
          nom: 1,       // Indice pour Prénom
          prenom: 2,    // Indice pour Nom
          numClub: 6,   // Indice pour Ville
          nomClub: 7,   // Indice pour Code Postal
          villeClub: 8  // Indice pour Pays
        };

        // Initialiser jsPDF
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('portrait', 'mm', 'a4');

        // Dimensions des étiquettes
        const labelWidth = 85;  // Largeur d'une étiquette en mm
        const labelHeight = 54; // Hauteur d'une étiquette en mm
        const marginX = 10;     // Marge gauche
        const marginY = 10;     // Marge haute
        const spacingX = 5;     // Espace horizontal entre étiquettes
        const spacingY = 5;     // Espace vertical entre étiquettes
        const columns = 2;      // Nombre d'étiquettes par ligne

        let x = marginX;
        let y = marginY;

        data.forEach((row, index) => {
          // Contenu de l'étiquette (organisé par lignes)
          const identifiant = `${row[columnMapping.identifiant] || ''}`;
          const prenomNom = `${row[columnMapping.nom] || ''} ${row[columnMapping.prenom] || ''}`;
          const numClub = `${row[columnMapping.numClub] || ''}`;
          const nomVilleClub = `${row[columnMapping.nomClub] || ''}, ${row[columnMapping.villeClub] || ''}`;

          // Dessiner l'étiquette
          pdf.rect(x, y, labelWidth, labelHeight); // Dessiner un cadre
          pdf.setFontSize(10);
          const centerX = x + labelWidth / 2; // Centre horizontal de l'étiquette
          const centerY = y + labelHeight / 2; // Centre vertical de l'étiquette
          pdf.text(identifiant, centerX, y + 10, { align: 'center' });
          pdf.setFontSize(12);  // Taille de police pour le contenu principal
          pdf.text(prenomNom, centerX, y + 20, { align: 'center' });     // Prénom + Nom
          pdf.setFontSize(10);  // Taille de police pour les autres informations
          pdf.text(numClub, centerX, y + 30, { align: 'center' });  // Adresse + Ville
          pdf.text(nomVilleClub, centerX, y + 40, { align: 'center' }); // Code Postal + Pays

          // Passer à l'étiquette suivante
          x += labelWidth + spacingX;
          if ((index + 1) % columns === 0) {
            x = marginX;                // Revenir à gauche
            y += labelHeight + spacingY; // Nouvelle ligne
          }

          // Ajouter une nouvelle page si nécessaire
          if (y + labelHeight > 297 - marginY) { // Limite pour A4
            pdf.addPage();
            x = marginX;
            y = marginY;
          }
        });

        // Sauvegarder le PDF
        pdf.save('etiquettes.pdf');
      };

      reader.readAsText(file);
    });
  </script>
</body>
</html>
